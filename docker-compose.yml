services:
  api:
    build: .
    env_file:
      - .env
    environment:
      # Run the in-process outbox dispatcher so the API delivers notifications to
      # its own WebSocket connections. No separate broker or worker process.
      REALTIME_DISPATCH_ENABLED: "true"
    ports:
      - "8000:80"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: headway
      POSTGRES_PASSWORD: headway
      POSTGRES_DB: headway
    ports:
      - "5432:5432"
    volumes:
      - headway_postgres:/var/lib/postgresql/data

volumes:
  headway_postgres:
