services:
  api:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WEBSOCKET_REDIS_CONSUMER_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      - redis

  outbox-worker:
    build: .
    command: ["python", "-m", "scripts.outbox_worker"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: headway
      POSTGRES_PASSWORD: headway
      POSTGRES_DB: headway
    ports:
      - "5432:5432"
    volumes:
      - headway_postgres:/var/lib/postgresql/data

volumes:
  headway_postgres:
