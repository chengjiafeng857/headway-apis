name: Deploy dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    environment: dev

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}

    steps:
      - name: Validate deploy configuration
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -s ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy dev branch
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" <<'EOF'
          set -euo pipefail

          cd /home/ec2-user/headway-apis
          git fetch origin dev
          git checkout dev
          git reset --hard origin/dev

          sudo docker build -t headway-apis-api:latest .
          sudo docker compose up -d --no-build --force-recreate api
          curl -fsS http://127.0.0.1/health
          sudo docker compose ps
          EOF
