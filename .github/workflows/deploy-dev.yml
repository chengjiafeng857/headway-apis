name: Deploy dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, Linux, ARM64, dev-deploy]
    needs: test
    environment: dev

    steps:
      - name: Deploy dev branch
        run: |
          set -euo pipefail

          cd /home/ec2-user/headway-apis
          git fetch origin dev
          git checkout dev
          git reset --hard origin/dev

          sudo docker build -t headway-apis-api:latest .
          sudo docker compose up -d --no-build --force-recreate api
          curl -fsS http://127.0.0.1/health
          sudo docker compose ps
